services:
  backend:
    build:
      context: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_MEDIA_ROOT: /app/media
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,backend}
      PGHOST: ${PGHOST:-shared-postgres}
      PGPORT: ${PGPORT:-5432}
      PGDATABASE: ${PGDATABASE:-anomaly_detection}
      PGUSER: ${PGUSER:-anomaly_app}
      PGPASSWORD: ${PGPASSWORD:?Set PGPASSWORD in .env}
      PGSSLMODE: ${PGSSLMODE:-prefer}
    volumes:
      - model_artifacts:/app/media
    networks:
      - default
      - database
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2)"
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

  frontend:
    build:
      context: ./frontend
    init: true
    volumes:
      - ./frontend/src:/app/src
      - ./frontend/config:/app/config
    ports:
      - "127.0.0.1:3000:8000"
    environment:
      BACKEND_URL: http://backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8000/user/login').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 60s

networks:
  database:
    external: true
    name: ${POSTGRES_NETWORK:-shared-postgres-network}

volumes:
  model_artifacts:
